spring.application.name=reassignment-engine
server.port=8080

spring.datasource.url=jdbc:h2:mem:ziprun;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# rule / rule-based (no API key) or ai (falls back to rule if LLM unavailable)
routing.strategy=rule-based

llm.provider=gemini
llm.api-key=${LLM_API_KEY:}
llm.model=gemini-1.5-flash
llm.base-url=https://generativelanguage.googleapis.com
llm.connect-timeout-ms=3000
llm.read-timeout-ms=8000

logging.level.com.ziprun.reassignment=INFO
